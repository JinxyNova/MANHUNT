name: Build Manhunt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean package

      - name: Jar en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Manhunt
          path: target/Manhunt.jar

      - name: Jar en release "latest"
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Manhunt (dernier build)
          files: target/Manhunt.jar
